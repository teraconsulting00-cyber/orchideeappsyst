<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agence - Orchidé Nature</title>
<link rel="icon" href="images/logo.png" type="image/png">
<link rel="apple-touch-icon" href="images/logo.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-container" id="appContainer">
<button type="button" class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu"><svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
<div class="sidebar" id="sidebar">
<div class="logo-wrap"><img src="images/logo.png" alt="Orchidé Nature" class="logo-img"><span id="appBrand">ORCHIDÉ NATURE</span></div>
<nav class="menu">
<a class="menu-item active" data-section="dashboard"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>Dashboard</span></a>
<a class="menu-item" data-section="operations"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg><span>Opérations</span></a>
<a class="menu-item" data-section="stocks"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg><span>Stocks</span></a>
<a class="menu-item" data-section="commandes"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg><span>Commandes</span></a>
<a href="production.html" class="menu-item"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg><span>Production & Stock</span></a>
</nav>
</div>
<div class="main-content">
<header class="header">
<div class="header-title"><h1 id="agenceName">Mon Agence</h1><p id="agenceInfo"></p></div>
<div class="user-info"><span id="userName"></span><button type="button" class="logout-btn" onclick="handleLogout()">Déconnexion</button></div>
</header>
<div id="content"></div>
</div>
</div>
<div class="modal" id="operationModal">
<div class="modal-content">
<div class="modal-header"><h2>Nouvelle opération</h2><button type="button" class="close-modal" onclick="closeModal('operationModal')">&times;</button></div>
<form id="operationForm">
<div class="form-grid">
<div class="form-group"><label>Type *</label><select id="typeOperation" required><option value="">Sélectionner...</option><option value="VENTE">Vente</option><option value="RECEPTION">Réception</option><option value="RETOUR">Retour</option></select></div>
<div class="form-group"><label>Produit *</label><select id="produitOperation" required></select></div>
<div class="form-group"><label>Quantité *</label><input type="number" id="quantiteOperation" min="1" required></div>
<div class="form-group"><label>Prix unitaire (CFA) *</label><input type="number" id="prixOperation" readonly step="0.01"></div>
<div class="form-group full"><label>Montant reçu (CFA)</label><input type="number" id="montantRecu" step="0.01"></div>
<div class="form-group full" id="renduWrap" style="display:none;"><div class="rendu-box"><span>Reliquat</span><strong id="renduValue">0 CFA</strong></div></div>
<div class="form-group full"><label>Notes</label><input type="text" id="notesOperation"></div>
</div>
<div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="closeModal('operationModal')">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div>
</form>
</div>
</div>
<div class="modal" id="editOperationModal">
<div class="modal-content">
<div class="modal-header"><h2>Modifier l'opération</h2><button type="button" class="close-modal" onclick="closeModal('editOperationModal')">&times;</button></div>
<form id="editOperationForm">
<input type="hidden" id="editOpId">
<div class="form-grid">
<div class="form-group"><label>Quantité *</label><input type="number" id="editQuantite" min="1" required></div>
<div class="form-group"><label>Prix unitaire (CFA) *</label><input type="number" id="editPrix" step="0.01" required></div>
<div class="form-group full"><label>Notes</label><input type="text" id="editNotes"></div>
</div>
<div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="closeModal('editOperationModal')">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div>
</form>
</div>
</div>
<div class="modal" id="commandeModal">
<div class="modal-content">
<div class="modal-header"><h2>Nouvelle commande</h2><button type="button" class="close-modal" onclick="closeModal('commandeModal')">&times;</button></div>
<form id="commandeForm">
<div class="form-group"><label>Date livraison souhaitée *</label><input type="date" id="dateLivraison" required></div>
<div class="form-group"><label>Produit *</label><select id="commandeProduit"></select></div>
<div class="form-group"><label>Quantité *</label><input type="number" id="commandeQuantite" min="1" required></div>
<div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="closeModal('commandeModal')">Annuler</button><button type="submit" class="btn btn-primary">Créer commande</button></div>
</form>
</div>
</div>
<script src="config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  var c = document.getElementById('appContainer');
  var t = document.getElementById('menuToggle');
  var o = document.getElementById('sidebarOverlay');
  if (t) t.addEventListener('click', function(){ c && c.classList.toggle('menu-open'); });
  if (o) o.addEventListener('click', function(){ c && c.classList.remove('menu-open'); });
})();
</script>
</body>
</html>
